# Deploy the Dioxus app (WASM) to GitHub Pages
#
# Prerequisites:
#   1. Go to repo Settings → Pages → Source → "GitHub Actions"
#   2. Push to main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # Allow manual triggers from the Actions tab
  workflow_dispatch:

# Ensures only one deployment runs at a time
concurrency:
  group: pages
  cancel-in-progress: true

# Grant the job permission to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: |
          curl -sSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Dioxus app
        run: dx build --release --base-path /sweet-delights-bakery

      - name: SPA fallback for client-side routing
        run: |
          cp target/dx/bakery-website/release/web/public/index.html \
             target/dx/bakery-website/release/web/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/bakery-website/release/web/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
